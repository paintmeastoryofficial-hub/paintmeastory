<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231c1510'/%3E%3Ccircle cx='9' cy='15' r='3.5' fill='%23c4956a'/%3E%3Ccircle cx='18' cy='10' r='2.5' fill='%238b6f47'/%3E%3Ccircle cx='23' cy='18' r='3' fill='%23c4956a'/%3E%3Ccircle cx='14' cy='22' r='2' fill='%23f5f0e8'/%3E%3Crect x='15' y='21' width='2' height='7' rx='1' fill='%239e8e7e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0e8; --paper: #faf7f2; --ink: #1c1510;
      --warm: #8b6f47; --accent: #c4956a; --muted: #9e8e7e;
      --rule: rgba(139,111,71,.25);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', sans-serif;
    }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 1rem; font-weight: 300; line-height: 1.7; }
    nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 1.1rem clamp(1.25rem, 6vw, 4rem); background: rgba(250,247,242,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
    nav a { text-decoration: none; }
    .logo { font-family: var(--serif); font-size: 1.15rem; color: var(--ink); letter-spacing: .04em; }
    .back { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .back:hover { color: var(--ink); }

    main { max-width: 600px; margin: 0 auto; padding: clamp(3rem, 8vw, 5rem) 1.25rem 4rem; }
    .eyebrow { font-size: .65rem; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); margin-bottom: .8rem; }
    h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1.05; }
    h1 em { font-style: italic; color: var(--warm); }
    .lead { color: var(--muted); margin: .8rem 0 2.5rem; }

    .label { display: block; font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.8rem; }
    .chip { font: 400 .85rem var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 999px; padding: .45rem 1rem; cursor: pointer; transition: all .2s; }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    .field { margin-bottom: 1.3rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    input, textarea { width: 100%; font: 300 1rem/1.5 var(--sans); color: var(--ink); background: #fff; border: 1px solid rgba(28,21,16,.16); padding: .7rem .85rem; border-radius: 0; transition: border-color .2s, box-shadow .2s; }
    input:focus, textarea:focus { outline: none; border-color: var(--warm); box-shadow: 0 0 0 3px rgba(196,149,106,.15); }
    textarea { min-height: 140px; resize: vertical; }
    .missing { border-color: #b4553a !important; animation: nudge .35s; }
    @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    .send { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: .6rem; margin-top: .6rem; }
    .btn { font: 400 .66rem var(--sans); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; padding: .95rem .8rem; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; transition: background .2s, color .2s; }
    .btn:hover { background: var(--ink); color: var(--cream); }
    .btn-main { background: var(--ink); color: var(--cream); }
    .btn-main:hover { background: var(--warm); border-color: var(--warm); }
    .warn { margin-top: .8rem; display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; background: rgba(196,149,106,.14); border-left: 3px solid var(--accent); padding: .65rem .85rem; font-size: .85rem; }
    .warn[hidden] { display: none; }
    .warn button { font: 400 .62rem var(--sans); letter-spacing: .14em; text-transform: uppercase; background: none; border: 1px solid var(--warm); color: var(--warm); padding: .35rem .7rem; cursor: pointer; }

    details { margin-top: 1.4rem; }
    summary { cursor: pointer; font-size: .78rem; color: var(--muted); list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '+ '; color: var(--accent); }
    details[open] summary::before { content: '− '; }
    .preview { margin-top: .8rem; background: #fff; border: 1px solid var(--rule); padding: 1rem 1.1rem; font-size: .85rem; line-height: 1.65; color: #4a3d31; white-space: pre-wrap; }
    .preview b { display: block; font-family: var(--serif); font-weight: 400; font-size: 1.1rem; color: var(--ink); margin-bottom: .6rem; }

    .other { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); font-size: .85rem; color: var(--muted); }
    .other a, .other button { color: var(--warm); background: none; border: none; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    .toast { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--cream); padding: .8rem 1.3rem; font-size: .85rem; opacity: 0; transition: all .3s; pointer-events: none; z-index: 50; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    @media (max-width: 560px) { .row, .send { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Paint Me A Story</a>
  <a href="index.html" class="back">← Back home</a>
</nav>

<main>
  <p class="eyebrow">Write to me</p>
  <h1>Let's <em>talk</em></h1>
  <p class="lead">Every message comes straight to me.</p>

  <span class="label">What's it about?</span>
  <div class="chips" id="topics"></div>

  <div class="field">
    <label class="label" for="f-msg">Your message *</label>
    <textarea id="f-msg" placeholder="Tell me what you have in mind…"></textarea>
  </div>
  <div class="row">
    <div class="field"><label class="label" for="f-name">Your name *</label><input id="f-name" autocomplete="name" /></div>
    <div class="field"><label class="label" for="f-phone">Phone / WhatsApp</label><input id="f-phone" type="tel" autocomplete="tel" /></div>
  </div>
  <div class="field"><label class="label" for="f-city">City</label><input id="f-city" autocomplete="address-level2" /></div>

  <div class="send">
    <a class="btn btn-main" id="send-gmail" target="_blank" rel="noopener">Send with Gmail</a>
    <a class="btn" id="send-mail">Other mail app</a>
    <button class="btn" type="button" id="send-copy">Copy</button>
  </div>
  <div class="warn" id="warn" hidden>
    <span id="warn-text"></span>
    <button type="button" id="warn-anyway">Continue anyway</button>
  </div>

  <details>
    <summary>See your email</summary>
    <div class="preview"><b id="subj"></b><span id="body"></span></div>
  </details>

  <p class="other">Prefer something else? Message me on <a href="https://instagram.com/paintmeastoryofficial" target="_blank" rel="noopener">Instagram</a> or <button type="button" id="copy-addr">copy my email address</button>.</p>
</main>
<div class="toast" id="toast"></div>

<script>
const EMAIL = 'paintmeastoryofficial@gmail.com';
const TOPICS = [
  ['commission', 'Commission'], ['textured', 'Textured art'], ['bottle', 'Bottle art'],
  ['prints', 'Prints'], ['collab', 'Collaboration'], ['hello', 'Something else']
];
const $ = id => document.getElementById(id), val = id => $(id).value.trim();
let topic = '';

TOPICS.forEach(([id, name]) => {
  const c = document.createElement('button');
  c.type = 'button'; c.className = 'chip'; c.textContent = name; c.dataset.id = id; c.setAttribute('aria-pressed', 'false');
  c.addEventListener('click', () => pick(topic === id ? '' : id));
  $('topics').appendChild(c);
});
function pick(id) {
  topic = id;
  [...$('topics').children].forEach(c => c.setAttribute('aria-pressed', c.dataset.id === id));
  refresh();
}
const topicName = () => (TOPICS.find(t => t[0] === topic) || [, ''])[1];

function letter() {
  const name = val('f-name') || '[your name]', first = name.split(' ')[0];
  const subject = (topicName() ? topicName() + ' — ' : 'Hello — ') + 'a message from ' + (val('f-name') ? first : 'a visitor');
  const body = 'Dear Ashwini,\n\n' + (val('f-msg') || '[your message]') + '\n\n' +
    (topicName() ? 'About: ' + topicName() + '\n' : '') +
    'Name: ' + name + '\n' +
    'Phone / WhatsApp: ' + (val('f-phone') || '—') + '\n' +
    'City: ' + (val('f-city') || '—') + '\n\n' +
    'Thank you,\n' + first;
  return { subject, body };
}
function refresh() {
  const { subject, body } = letter(), q = encodeURIComponent;
  $('subj').textContent = subject; $('body').textContent = body;
  $('send-gmail').href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + q(EMAIL) + '&su=' + q(subject) + '&body=' + q(body);
  $('send-mail').href = 'mailto:' + EMAIL + '?subject=' + q(subject) + '&body=' + q(body);
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
function remember() { try { ['f-name', 'f-phone', 'f-city'].forEach(k => localStorage.setItem('pmas-' + k, val(k))); } catch (e) {} }

let pending = null;
function check(e, action) {
  const missing = ['f-msg', 'f-name'].filter(k => !val(k));
  if (!missing.length) { $('warn').hidden = true; return false; }
  e.preventDefault();
  missing.forEach(k => { $(k).classList.remove('missing'); void $(k).offsetWidth; $(k).classList.add('missing'); });
  $(missing[0]).focus();
  $('warn-text').textContent = missing.length === 2 ? 'Please add a message and your name.' : missing[0] === 'f-name' ? 'Please add your name.' : 'Please add a message.';
  pending = action; $('warn').hidden = false;
  return true;
}
const openLink = id => { remember(); refresh(); const a = $(id); if (a.target === '_blank') window.open(a.href, '_blank', 'noopener'); else location.href = a.href; };
async function copyLetter() {
  remember(); refresh();
  const { subject, body } = letter();
  toast(await copyText('To: ' + EMAIL + '\nSubject: ' + subject + '\n\n' + body) ? 'Copied — paste it into a new mail to ' + EMAIL : 'Could not copy — please select the text and copy it');
}
['send-gmail', 'send-mail'].forEach(k => $(k).addEventListener('click', e => { if (!check(e, () => openLink(k))) { remember(); refresh(); } }));
$('send-copy').addEventListener('click', e => { if (!check(e, copyLetter)) copyLetter(); });
$('warn-anyway').addEventListener('click', () => { $('warn').hidden = true; document.querySelectorAll('.missing').forEach(x => x.classList.remove('missing')); if (pending) pending(); });
$('copy-addr').addEventListener('click', async () => toast(await copyText(EMAIL) ? 'Email address copied' : EMAIL));
['f-msg', 'f-name', 'f-phone', 'f-city'].forEach(k => $(k).addEventListener('input', () => {
  $(k).classList.remove('missing'); if (val('f-msg') && val('f-name')) $('warn').hidden = true; refresh();
}));

try { ['f-name', 'f-phone', 'f-city'].forEach(k => { const v = localStorage.getItem('pmas-' + k); if (v) $(k).value = v; }); } catch (e) {}
const want = new URLSearchParams(location.search).get('topic');
pick(TOPICS.some(t => t[0] === want) ? want : '');
</script>
</body>
</html>
